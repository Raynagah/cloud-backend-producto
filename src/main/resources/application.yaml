server:
  port: 8082

spring:
  application:
    name: ms-producto

  # CONFIGURACIÓN DE DATASOURCE MEDIANTE VARIABLES DE ENTORNO
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/db_producto}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:admin}

  # CONFIGURACIÓN DE JPA E HIBERNATE PARA POSTGRESQL
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true

# CONFIGURACIÓN DE SEGURIDAD (La misma clave que usa ms-usuarios)
jwt:
  secret: UnaClaveSecretaMuyLargaYSeguraParaPoderFirmarElToken256BitsMinimo!

# CONFIGURACIÓN DE SPRINGDOC (SWAGGER) PARA DOCUMENTACIÓN
springdoc:
  show-actuator: true
  swagger-ui:
    use-root-path: true
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    path: /api/producto/v1/api-docs